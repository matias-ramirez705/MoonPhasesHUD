[MoonPhaseHUD]
; Translation language override: english, spanish, french, german, ...
; Empty = follow the game language (SkyrimPrefs.ini, sLanguage setting).
; Translation files live in Data\Interface\Translations\MoonPhaseHUD_<language>.txt
Language=

; --- General behaviour ---
; Enabled: 1 shows the widget, 0 disables it completely.
Enabled=1
; Mode: 0 Always / 1 Timed (hotkey) / 2 Toggle (hotkey) / 3 Periodic (every PeriodHours in-game hours).
Mode=0
; Hotkey: DirectInput scan code (F7 = 65 = 0x41). Mouse buttons are 256+.
Hotkey=65
; ShowDuration: seconds the widget stays visible in Timed / Periodic modes.
ShowDuration=5.000
PeriodHours=6
HideInCombat=0
; Keep the widget visible while the console is open (the console pauses the game).
ShowInConsole=1
HideInDialogue=0
HideInFurnitureMenu=0

; --- Widget placement ---
; Anchor: 0 TL / 1 TC / 2 TR / 3 ML / 4 MC / 5 MR / 6 BL / 7 BC / 8 BR (top/middle/bottom, left/centre/right).
Anchor=2
MarginX=40
MarginY=40
Scale=100.000
Opacity=100.000

; --- Night-sky plate ---
; ShowSky: dark circle with stars behind the moons. ShowStars: the small stars.
ShowSky=1
ShowStars=1
; CustomColor: 0 = natural colours (warm pale Masser, cool blue Secunda).
CustomColor=0
BadgeColorR=0.850
BadgeColorG=0.800
BadgeColorB=0.700

; --- Masser (greater moon): offset in pixels inside the badge, size in percent ---
ShowMasser=1
MasserX=0
MasserY=0
MasserScale=100.000

; --- Secunda (lesser moon) ---
ShowSecunda=1
SecundaX=0
SecundaY=0
SecundaScale=100.000

; --- Phase-name text under the moons ---
; LabelSource: 0 = name of Masser's phase, 1 = Secunda's.
ShowLabel=1
LabelSource=0
LabelX=0
LabelY=0
LabelScale=100.000
Shadow=1
TextR=0.950
TextG=0.920
TextB=0.870
