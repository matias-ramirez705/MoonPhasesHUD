name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-bincache

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Checkout CommonLibSSE-NG (ng branch)
        uses: actions/checkout@v4
        with:
          repository: alandtse/CommonLibSSE-NG
          ref: ng
          path: deps/CommonLibSSE
          submodules: recursive

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Ensure Ninja
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
          }
          $chocoBin = Join-Path $env:ChocolateyInstall "bin"
          "$chocoBin" | Out-File -Append $env:GITHUB_PATH -Encoding utf8
          $env:PATH = "$chocoBin;$env:PATH"
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            throw "Ninja was not found after installation."
          }

      - name: Set up vcpkg (pinned to the manifest baseline)
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg $env:GITHUB_WORKSPACE/vcpkg
          git -C $env:GITHUB_WORKSPACE/vcpkg checkout ee12231b20c95013c6638d845d04c91559a1d1ff
          & "$env:GITHUB_WORKSPACE/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=$env:GITHUB_WORKSPACE\vcpkg" | Out-File -Append $env:GITHUB_ENV -Encoding utf8

      - name: Create vcpkg binary cache directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\vcpkg-bincache" | Out-Null

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: vcpkg-bincache
          key: vcpkg-binaries-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'cmake/ports/**') }}
          restore-keys: |
            vcpkg-binaries-${{ runner.os }}-

      - name: Configure
        env:
          COMMONLIB_SSE_FOLDER: ${{ github.workspace }}/deps/CommonLibSSE
        run: cmake --preset release

      - name: Build
        run: cmake --build build/release

      - name: Package
        shell: pwsh
        run: |
          $out = "package/MoonPhasesHUD/Data"
          New-Item -ItemType Directory -Force -Path "$out/SKSE/Plugins", "$out/Interface/Translations" | Out-Null
          Copy-Item "build/release/MoonPhaseHUD.dll" "$out/SKSE/Plugins/"
          Copy-Item "dist/Data/SKSE/Plugins/MoonPhaseHUD.ini" "$out/SKSE/Plugins/"
          Copy-Item "dist/Data/Interface/MoonPhaseHUD.swf" "$out/Interface/"
          Copy-Item "dist/Data/Interface/Translations/MoonPhaseHUD_english.txt" "$out/Interface/Translations/"
          Copy-Item "dist/Data/Interface/Translations/MoonPhaseHUD_spanish.txt" "$out/Interface/Translations/"
          Copy-Item "dist/Data/Interface/Translations/MoonPhaseHUD_template.txt" "$out/Interface/Translations/"
          Compress-Archive -Path "package/MoonPhasesHUD/*" -DestinationPath "MoonPhasesHUD.zip" -Force
          Get-FileHash "MoonPhasesHUD.zip" -Algorithm SHA256 | Format-List

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoonPhasesHUD
          path: MoonPhasesHUD.zip
          if-no-files-found: error
